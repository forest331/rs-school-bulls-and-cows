name: Deploy to GitHub Pages

on:
  push:
    branches: ['bulls-and-cows'] # Запускать при пуше в нашу ветку
  workflow_dispatch: # Позволяет запустить вручную из вкладки Actions

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Build (tsc)
        run: npx tsc

      - name: Prepare artifact
        run: |
          mkdir public
          cp index.html public/
          cp -r dist public/
          cp -r src/styles.css public/ || true
          mkdir -p public/src
          cp src/styles.css public/src/ || true

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './public'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
